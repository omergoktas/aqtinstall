[project]
name = "aqtinstall"
description = "Another unofficial Qt installer"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Hiroshi Miura", email = "miurahr@linux.com"},
]
maintainers = [
    {name = "Ömer Göktaş"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: C++",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.12"
# Every package an install takes is pinned, the dependencies of the dependencies too, each to the
# version that was checked for malware, so an install of a tag gets the same packages every time
# and never a release that came out later. `uv tool install` and pip resolve only what these lines
# allow. After changing a pin, list the whole set again for CPython with
# `uv pip compile pyproject.toml --universal --python-version 3.12` and pin every package it names.
# On PyPy, py7zr takes brotlicffi in place of brotli, which stays unpinned.
dependencies = [
    # aqtinstall's own
    "bs4==0.0.2",  # canonical name is beautifulsoup4
    "defusedxml==0.7.1",
    "humanize==4.17.0",
    "patch-ng==1.19.1",
    "py7zr==1.1.4",
    "requests==2.34.2",
    "semantic-version==2.10.0",
    "texttable==1.7.3",
    # What those bring in turn
    "backports.zstd==1.8.0; python_full_version < '3.14'",
    "beautifulsoup4==4.15.0",
    "brotli==1.2.1; platform_python_implementation == 'CPython'",
    "certifi==2026.10.23",
    "charset-normalizer==3.5.2",
    "idna==3.20",
    "inflate64==1.0.4",
    "multivolumefile==0.2.3",
    "psutil==7.2.2; sys_platform != 'cygwin'",
    "pybcj==1.0.8",
    "pycryptodomex==3.24.2",
    "pyppmd==1.3.1",
    "soupsieve==4.1.1",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
]
dynamic = ["version", "readme"]

[tool.setuptools]
packages = ["aqt"]

[tool.setuptools.dynamic]
readme = {file = ["README.rst"]}

[tool.setuptools.package-data]
aqt = ["*.yml", "*.ini"]

[project.scripts]
aqt = "aqt.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-remotedata>=0.4.1",
    "pytest-socket",
    "pytest-timeout",
    "pympler",
]
check = [
    "mypy>=1.10.0",
    "ruff>=0.6.0",
    "docutils",
    "check-manifest",
    "readme-renderer",
    "pygments",
    "packaging",
    "pylint",
    "types-requests",
]
docs = [
    "sphinx>=7.0",
    "sphinx_rtd_theme>=1.3",
    "sphinx-py3doc-enhanced-theme>=2.4",
]
debug = [
    "pytest-leaks",
]

[project.urls]
Documentation = "https://aqtinstall.readthedocs.io/"
Source = "https://github.com/omergoktas/aqtinstall"
Changelog = "https://github.com/omergoktas/aqtinstall/blob/master/docs/CHANGELOG.rst"
Upstream = "https://github.com/miurahr/aqtinstall"

[build-system]
# Pinned like the dependencies, since an install from the repository builds the package and runs
# these; packaging and vcs-versioning are what setuptools-scm brings.
requires = ["setuptools==84.2.1", "setuptools-scm==10.3.4", "vcs-versioning==2.6.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "aqt/version.py"
write_to_template = """
__version__ = \"{version}\"
"""
tag_regex = "^(?P<prefix>v)?(?P<version>[^\\+]+)(?P<suffix>.*)?$"

[tool.check-manifest]
ignore = ["aqt/version.py","azure-pipelines.yml", ".readthedocs.yml", "ci/*"]

[tool.coverage.run]
branch = true
parallel = true
source = ["aqt", "tests"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["if __name__ == .__main__.:", "pragma: no-cover", "@abstract", "def __repr__"]

[tool.pylint]
max-line-length = 125

[tool.ruff]
line-length = 125
target-version = "py312"
extend-exclude = ["docs/conf.py", "build", "dist", "tmp", "venv"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, PYI: flake8-pyi
select = ["E", "W", "F", "I", "PYI"]
# E203: whitespace before ':' (conflicts with black slice formatting)
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["aqt"]
known-third-party = ["docutils", "flake8", "pyannotate_runtime", "pytest", "pytz", "requests", "setuptools", "sphinx", "yaml", "packaging"]

[tool.mypy]
# Untyped definitions and calls are disable in default
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_untyped_decorators = false
# not a all 3rd party package has type hints
ignore_missing_imports = true
# Optional check: implicit check enabled in mypy 0.980 or before
strict_optional = true
implicit_optional = false
# Enable incremental mode and use sqlite cache
incremental = true
sqlite_cache = true
# Enables PEP 420 style namespace packages
namespace_packages = true
# Control error output
pretty = true
color_output = true
show_error_context = false
show_column_numbers = true
error_summary = true
# configuring warnings
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

# TODO: Remove this `ignore_missing_imports` and add type stubs.
# See https://mypy.readthedocs.io/en/stable/running_mypy.html#missing-imports
[[tool.mypy.overrides]]
module = "texttable"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = "test*.py"
norecursedirs = [".git", "_build", "tmp", ".eggs"]
timeout = 480
markers = [
    "unit: mark a test as an unit test.",
    "enable_socket : mark a test with enabling socket.",
    "remote_data: mark a test with remote data.",
]


[tool.tox]
requires = ["tox>=4.19"]
envlist = [
    "mypy",
    "check",
    "3.12",
    "3.13",
    "3.14",
    "docs",
    "mprof",
    "mypy",
    "fil"
]
isolated_build = true

[tool.tox.env_run_base]
description = "Run test under {base_python}"
passenv = [
    "GITHUB_*",
    "PYTEST_ADDOPTS",
    "COVERALLS_*",
]
extras = ["test", "check", "docs"]
commands = [["python", "-m", "pytest", "-vv"]]

[tool.tox.env.check]
extras = ["check"]
commands = [
    ["check-manifest", "{toxinidir}"],
    ["ruff", "check", "aqt", "tests", "ci", "tools"],
    ["ruff", "format", "--check", "aqt", "tests", "ci", "tools"],
]

[tool.tox.env.mypy]
extras = ["check"]
deps = ["lxml", "types-requests", "types-beautifulsoup4", "types-psutil"]
commands = [["mypy", "--html-report", "build/mypy", "aqt"]]

[tool.tox.env.docs]
extras = ["docs"]
commands = [
    ["sphinx-build", "{posargs:-E}", "-b", "html", "docs", "build/docs"],
    ["sphinx-build", "-b", "linkcheck", "docs", "build/docs"]
]

[tool.tox.env.mprof]
extras = ["test", "debug"]
commands = [
    ["mprof", "run", "--multiprocess", "python", "-m", "aqt", "install-qt", "-O", "/tmp", "-d", "/tmp", "linux", "desktop", "6.8.1"],
    ["mprof", "plot", "--output", "memory-profile.png"]
]
deps = ["memory_profiler", "matplotlib"]

[tool.tox.env.fil]
extras = ["debug"]
commands = [
    ["fil-profile", "run", "-m", "aqt", "install-qt", "-O", "/tmp", "-d", "/tmp", "linux", "desktop", "6.8.1"]
]
deps = ["filprofiler"]

[tool.tox.env.coveralls]
deps = ["coveralls"]
skip_install = true
commands = [["coveralls", "[]"]]
