# Builds aqt as one standalone program for each of six platforms with
# PyInstaller, checks that each starts and names the release's version, and
# attaches them to the release, so that an installer such as mise installs aqt
# with no Python and no git. A release starts it; started by hand, it builds
# the tag given and replaces that release's programs.

name: Upload release artifacts

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v4.4.0
        required: true

permissions:
  contents: read

# One run per tag at a time; a second waits instead of cancelling the first.
concurrency:
  group: standalone-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04's glibc 2.35, so the program runs on that release and later
          - platform: linux-amd64
            os: ubuntu-22.04
          - platform: linux-arm64
            os: ubuntu-22.04-arm
          - platform: macos-amd64
            os: macos-15-intel
          - platform: macos-arm64
            os: macos-15
          - platform: windows-amd64
            os: windows-2025
          - platform: windows-arm64
            os: windows-11-arm
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      # setuptools-scm takes the version from the tag, so the checkout needs
      # the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # PyInstaller and what it brings come with their hashes; the package
      # takes the exact versions pyproject.toml pins.
      - name: Install PyInstaller and the package
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r tools/standalone-requirements.txt
          python -m pip install --disable-pip-version-check .
      - name: Build the program
        run: python tools/build_standalone.py
      - name: Check that it starts and names the tag's version
        run: |
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          program="dist/aqt-$PLATFORM$suffix"
          mv "dist/aqt$suffix" "$program"
          "$program" version 2>&1 | tee version.txt
          grep -F "v${TAG#v} " version.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aqt-${{ matrix.platform }}
          path: dist/aqt-${{ matrix.platform }}*
          if-no-files-found: error

  attach:
    name: Attach the programs to the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The upload adds files to the release.
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: programs
          merge-multiple: true
      - name: Attach them, replacing earlier copies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" programs/aqt-* --clobber --repo "$GITHUB_REPOSITORY"
